name = "spectra-relay"
main = "cloud/cloud-relay-worker.js"
compatibility_date = "2024-10-01"

# 24/7 Background Cron Trigger (Runs every 1-5 minutes to monitor SPeCTRUM)
[triggers]
crons = ["* * * * *"]

# Cloudflare Workers KV Namespace binding
# Run: npx wrangler kv:namespace create SPECTRA_KV
# Then paste the generated id below:
# [[kv_namespaces]]
# binding = "SPECTRA_KV"
# id = "your-kv-namespace-id-here"

# Environment variables / secrets
# Set via: npx wrangler secret put RELAY_SECRET_KEY
# Optional (can also be synced directly from Chrome extension popup):
# npx wrangler secret put TELEGRAM_BOT_TOKEN
# npx wrangler secret put TELEGRAM_CHAT_ID
